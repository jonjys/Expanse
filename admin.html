<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Expanse admin</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#02030c">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://gjmkhnrgznorxxaemsmo.supabase.co" crossorigin>
<style>
@font-face{font-family:"Instrument Sans";src:url(/fonts/instrument-sans-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Instrument Sans";src:url(/fonts/instrument-sans-500.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Instrument Sans";src:url(/fonts/instrument-sans-600.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Instrument Sans";src:url(/fonts/instrument-sans-700.woff2) format("woff2");font-weight:700 900;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url(/fonts/ibm-plex-mono-500.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url(/fonts/ibm-plex-mono-600.woff2) format("woff2");font-weight:600 700;font-display:swap}
:root{--bg:#02030c;--card:rgba(10,14,40,.92);--line:rgba(140,160,255,.13);--line2:rgba(150,170,255,.24);--txt:#fff;--txt2:#c3caf0;--muted:#8b94c9;--lime:#c8ff3d;--cyan:#5ee1ff;--amber:#ffcf4a;--red:#ff6b6b;--violet:#b39cff;--ease:cubic-bezier(.2,.8,.2,1)}
*,*::before,*::after{box-sizing:border-box}*{margin:0;padding:0}
html{background:var(--bg)}
body{min-height:100vh;color:var(--txt);font:400 15px/1.5 "Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;background:radial-gradient(ellipse 80% 60% at 70% 0%,#141d5e 0%,#080c2e 45%,#02030c 100%) fixed}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
[hidden]{display:none!important}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 16px;border-radius:999px;font-weight:700;font-size:14px;white-space:nowrap;transition:transform .15s var(--ease),background .15s,border-color .15s;border:1.5px solid transparent}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.55;pointer-events:none}
.btn-primary{background:var(--lime);color:#071026}
.btn-ghost{border-color:var(--line2);background:rgba(255,255,255,.04)}
.btn-ghost:hover{border-color:rgba(255,255,255,.5)}
.btn-ok{background:var(--lime);color:#071026}
.btn-warn{border-color:rgba(255,207,74,.55);color:var(--amber)}
.btn-warn:hover{background:rgba(255,207,74,.12)}
.btn-bad{border-color:rgba(255,107,107,.5);color:#ff9a9a}
.btn-bad:hover{background:rgba(255,107,107,.14)}
.btn-sm{height:32px;padding:0 12px;font-size:13px}
.linkbtn{color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:13px}
.linkbtn:hover{color:#fff}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login form{width:min(420px,100%);padding:30px;border-radius:24px;background:var(--card);border:1px solid var(--line2);box-shadow:0 30px 80px rgba(0,0,0,.5)}
.login h1{font-size:30px;letter-spacing:-.04em;margin:10px 0 6px}
.login p{color:var(--txt2);font-size:14px}
.field{display:block;margin-top:16px}
.field>span{display:block;color:var(--muted);margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;height:44px;padding:0 14px;border-radius:12px;background:rgba(2,3,12,.7);border:1.5px solid var(--line2);outline:0;font-size:15px}
.field textarea{height:auto;min-height:84px;padding:10px 14px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--lime)}
.check{display:flex;gap:8px;align-items:center;margin-top:12px;color:var(--txt2);font-size:13.5px}
.check input{accent-color:var(--lime);width:16px;height:16px}
.login .btn{width:100%;margin-top:18px;height:46px}

/* header */
.top{position:sticky;top:0;z-index:20;background:rgba(2,3,12,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:-.04em;text-decoration:none}
.orb{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#c8ff3d,#5ee1ff 45%,#1a5fff);box-shadow:0 0 18px rgba(94,225,255,.6)}
.logo small{color:var(--lime);margin-left:2px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;padding:4px 0}
.tabs::-webkit-scrollbar{display:none}
.tabs button{position:relative;height:36px;padding:0 14px;border-radius:999px;font-weight:700;font-size:14px;color:var(--txt2);white-space:nowrap}
.tabs button[aria-selected="true"]{background:#fff;color:#071026}
.tabs .n{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--amber);color:#071026;font-size:11.5px;font-weight:800}
.top .right{display:flex;gap:8px;align-items:center}
@media (max-width:760px){.top .wrap{flex-wrap:wrap;height:auto;padding-top:10px;padding-bottom:6px;gap:8px}.tabs{order:3;flex-basis:100%}.logo{flex:1}}

main{padding:26px 0 80px}
h2.h{font-size:30px;letter-spacing:-.04em;line-height:1}
.sub{color:var(--txt2);margin-top:6px;font-size:14.5px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:18px}
.chip{height:32px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line2);font-size:13px;font-weight:600;color:var(--txt2)}
.chip[aria-pressed="true"]{border-color:var(--lime);color:#fff;background:rgba(200,255,61,.1)}
.bar input[type=search]{height:36px;min-width:220px;flex:1;max-width:340px;padding:0 14px;border-radius:999px;background:rgba(2,3,12,.7);border:1.5px solid var(--line2);outline:0}
.empty{margin-top:22px;padding:40px 20px;border-radius:20px;border:1px dashed var(--line2);text-align:center;color:var(--txt2)}
.empty b{display:block;color:#fff;font-size:20px;letter-spacing:-.02em;margin-bottom:6px}

/* product cards */
.list{display:grid;gap:14px;margin-top:20px}
.pc{position:relative;padding:20px 22px;border-radius:20px;background:var(--card);border:1px solid var(--line2);overflow:hidden}
.pc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,var(--muted))}
.pc .head{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.pc .name{font-size:22px;font-weight:700;letter-spacing:-.03em}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
.st-pending{background:var(--amber);color:#071026}
.st-approved{background:var(--lime);color:#071026}
.st-rejected{background:#ff9a9a;color:#071026}
.st-hidden,.st-removed{background:var(--muted);color:#071026}
.st-requested,.st-awaiting_payment{background:var(--amber);color:#071026}
.st-live{background:var(--lime);color:#071026}
.st-upcoming{background:#5ee1ff;color:#071026}
.st-ended,.st-expired,.st-rejected-p,.st-cancelled{background:var(--muted);color:#071026}
.sched{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 12px}
.sched .field{margin-top:12px}
.prep{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;color:var(--txt2);font-size:14px}
.prep b{color:#fff}
.b-star{background:var(--amber);color:#071026}
.b-ver{background:#fff;color:#071026}
.b-rep{background:rgba(255,107,107,.18);color:#ffb0b0;border:1px solid rgba(255,107,107,.4)}
.b-cat{color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}
.pc .tag{color:var(--txt2);margin-top:6px;font-size:15.5px}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;color:var(--muted);font-size:13px}
.meta a{color:var(--cyan);text-decoration:none}
.meta a:hover{text-decoration:underline}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-top:14px}
.fact{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid var(--line);min-width:0}
.fact small{display:block;color:var(--muted);font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.fact span{display:block;font-size:14px;margin-top:2px;overflow-wrap:anywhere}
.needs{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.need{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;background:rgba(200,255,61,.08);border:1px solid rgba(200,255,61,.3);color:var(--lime);font-size:12.5px;font-weight:600}
.desc{margin-top:12px;color:var(--txt2);font-size:14.5px;white-space:pre-line;overflow-wrap:anywhere}
.desc.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.imgs{display:flex;gap:8px;margin-top:12px;overflow-x:auto}
.imgs a{flex:none}
.imgs img{height:96px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04)}
.checks{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.ck{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:9px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-size:12.5px;color:var(--txt2)}
.ck i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.ck.ok i{background:var(--lime);box-shadow:0 0 8px var(--lime)}
.ck.bad i{background:var(--red);box-shadow:0 0 8px var(--red)}
.reps{margin-top:12px;display:grid;gap:6px}
.rep{padding:10px 12px;border-radius:12px;background:rgba(255,107,107,.07);border:1px solid rgba(255,107,107,.25);font-size:13.5px;color:#ffd4d4}
.rep b{color:#fff}
.note{margin-top:12px;padding:10px 12px;border-radius:12px;background:rgba(255,207,74,.08);border:1px solid rgba(255,207,74,.3);color:#ffe7a6;font-size:13.5px}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.acts .sp{flex:1}
.decide{margin-top:12px;padding:14px;border-radius:14px;background:rgba(2,3,12,.55);border:1px solid var(--line2)}
.decide .presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.decide .presets button{height:28px;padding:0 10px;border-radius:999px;border:1px dashed var(--line2);font-size:12.5px;color:var(--txt2)}
.decide .presets button:hover{border-color:var(--lime);color:var(--lime)}
.decide textarea{width:100%;min-height:70px;margin-top:10px;padding:10px 12px;border-radius:12px;background:rgba(2,3,12,.7);border:1.5px solid var(--line2);outline:0;resize:vertical}
.decide .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

/* reports */
.rrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start;padding:16px 18px;border-radius:16px;background:var(--card);border:1px solid var(--line2)}
.rrow.done{opacity:.6}
.rrow .t{font-weight:700}
.rrow .d{color:var(--txt2);font-size:14px;margin-top:4px;overflow-wrap:anywhere}
.rrow .m{color:var(--muted);font-size:12.5px;margin-top:6px}
.rrow .a{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:640px){.rrow{grid-template-columns:1fr}.rrow .a{justify-content:flex-start}}

/* overview */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:20px}
.kpi{padding:16px;border-radius:16px;background:var(--card);border:1px solid var(--line2)}
.kpi b{display:block;font-size:30px;letter-spacing:-.04em;line-height:1.1}
.kpi small{color:var(--muted);font-size:12.5px}
.kpi.warn b{color:var(--amber)}
.panel{margin-top:16px;padding:18px;border-radius:18px;background:var(--card);border:1px solid var(--line2)}
.panel h3{font-size:17px;letter-spacing:-.02em;margin-bottom:10px}
.chart{display:flex;align-items:flex-end;gap:3px;height:130px}
.chart .d{flex:1;height:100%;display:flex;align-items:flex-end;position:relative}
.chart .v{width:100%;background:rgba(94,225,255,.55);border-radius:3px 3px 0 0;min-height:1px}
.chart .c{position:absolute;left:22%;right:22%;bottom:0;background:var(--lime);border-radius:2px 2px 0 0}
.legend{display:flex;gap:14px;margin-top:8px;color:var(--muted);font-size:12px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--muted);font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;padding:0 0 8px}
td{padding:9px 0;border-top:1px solid var(--line)}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.sys{color:var(--txt2);font-size:14px;display:grid;gap:4px}

/* settings */
.set{max-width:640px}
.keybox{margin-top:14px;padding:14px 16px;border-radius:16px;border:1px solid rgba(200,255,61,.35);background:rgba(200,255,61,.06)}
.keybox code{display:block;margin-top:8px;padding:10px 12px;border-radius:10px;background:rgba(2,3,12,.8);border:1px solid var(--line2);font:600 14px/1.4 "IBM Plex Mono",monospace;overflow-wrap:anywhere;user-select:all}
.fine{margin-top:10px;color:var(--muted);font-size:12.5px;line-height:1.45}

.toast{position:fixed;z-index:50;left:50%;bottom:24px;transform:translate(-50%,10px);max-width:min(92vw,520px);padding:11px 18px;border-radius:16px;background:var(--lime);color:#071026;font-weight:700;font-size:14px;text-align:center;box-shadow:0 12px 40px rgba(200,255,61,.35);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s var(--ease)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.err{background:#ff9a9a}
.loading{margin-top:24px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<section class="login" id="login" hidden>
  <form id="loginForm" autocomplete="off">
    <a class="logo" href="/"><span class="orb"></span>Expanse<small class="mono">admin</small></a>
    <h1>Review and run Expanse.</h1>
    <p>Sign in with your admin key. It's checked against a hash in the database and never leaves this browser otherwise.</p>
    <label class="field"><span class="mono">Admin key</span><input id="keyIn" type="password" placeholder="adm_…" spellcheck="false" autocomplete="off"></label>
    <label class="check"><input type="checkbox" id="remember"> Remember on this device</label>
    <button class="btn btn-primary" type="submit" id="loginBtn">Sign in</button>
  </form>
</section>

<div id="shell" hidden>
  <header class="top">
    <div class="wrap">
      <a class="logo" href="/" title="Open the site"><span class="orb"></span>Expanse<small class="mono">admin</small></a>
      <nav class="tabs" role="tablist" id="tabs">
        <button role="tab" data-tab="queue" aria-selected="true">To review<span class="n" id="nQueue" hidden></span></button>
        <button role="tab" data-tab="reports" aria-selected="false">Reports<span class="n" id="nReports" hidden></span></button>
        <button role="tab" data-tab="withdrawals" aria-selected="false">Withdrawals</button>
        <button role="tab" data-tab="map-purchases" aria-selected="false">Map purchases</button>
        <button role="tab" data-tab="placements" aria-selected="false">Placements<span class="n" id="nPlace" hidden></span></button>
        <button role="tab" data-tab="products" aria-selected="false">Products</button>
        <button role="tab" data-tab="overview" aria-selected="false">Overview</button>
        <button role="tab" data-tab="settings" aria-selected="false">Settings</button>
      </nav>
      <div class="right"><button class="btn btn-ghost btn-sm" id="refresh" title="Refresh">↻</button><button class="btn btn-ghost btn-sm" id="signOut">Sign out</button></div>
    </div>
  </header>
  <main class="wrap" id="main"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/admin.js?v=launch-20261019" defer></script>
</body>
</html>
